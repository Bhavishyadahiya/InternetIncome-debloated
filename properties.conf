######################### User Configuration Starts here #########################

# Leave the values as blank if you do not wish to run the app
# Use single quotes instead of double quotes when setting the email, password, or API key to properly handle special characters.
# Make sure your password does not already contain single or double quotes; otherwise, you will need to use a backslash to escape these characters.
# An example for DEVICE_NAME is mentioned below, where single quotes are used in the value.

# Set you device name below
DEVICE_NAME='ubuntu'

# Set your repocket API (email is no longer required)
REPOCKET_API=

# Set your traffmonetizer API
TRAFFMONETIZER_TOKEN=

# Set your Proxybase Access token
PROXYBASE_ACCOUNT_ID=

# Set your Proxyrack API
# Devices are automatically added to dashboard after few minutes
PROXYRACK_API=

# Set your IPRoyals Pawns email and password
IPROYALS_EMAIL=
IPROYALS_PASSWORD=

# Peer2profit removed official support for docker. 
# Please use their telegram bot @peer2profit_app_bot to login
PEER2PROFIT_EMAIL=

# Set your antGain API
ANTGAIN_API_KEY=

# Set your wizardGain email 
WIZARD_GAIN_EMAIL=

# Set your packetstream CID value
# Get the value using https://github.com/engageub/InternetIncome/wiki/CID-for-packetstream
PACKETSTREAM_CID=

# Set your proxylite User ID 
PROXYLITE_USER_ID=

# Set your earn fm API
# Enabling EarnFM Fleetshare will run all socks5 proxies in a single container
EARN_FM_API=
USE_EARN_FM_FLEETSHARE=false

# URnetwork Auth Token
# Place the token between single quotes
# Run the script within 1 minute after copying the token
# Enabling URNetwork proxy mode will run all socks5 proxies in a single container
UR_AUTH_TOKEN=
UR_NETWORK_PROXY_MODE=false

# Titan Network Identity Code
TITAN_HASH=

# Bitping Email and Password
# Disable MFA at https://nodes.bitping.com/settings before running the script
BITPING_EMAIL=
BITPING_PASSWORD=

# Wipter Email and Password
WIPTER_EMAIL=
WIPTER_PASSWORD=

# IdlePay enrollment key from https://app.idlepay.io/devices (ipk_...)
# Only needed to enroll; persistent idlepay-data keeps the device identity
# With USE_PROXIES=true, one IdlePay container uses proxies.txt natively, with direct traffic disabled
IDLEPAY_KEY=

# Set the value to true if you wish to use Mysterium node
# You will see URL of the mysterium node in the console output.
# Once your node is connected, you need to access the url using browser to start the node by making payment if not already
# For more details, visit:
# https://github.com/engageub/InternetIncome/wiki/Accessing-Mysterium-Nodes-for-Initial-Payment
MYSTERIUM=false

######################### Auto Update Containers #########################

# Set to true to update this run's app images tagged latest, arm64v8 or arm32v7
# Starts a scoped Watchtower helper; pinned images and tunnel/helper containers are excluded
AUTO_UPDATE_CONTAINERS=false

######################### Network Configuration #########################

# Enable the following option if you use proxies
# Create a file name proxies.txt and add your proxies in the format protocol://user:pass@ip:port
# For choosing between proxy vs tun container type, refer:
# https://github.com/engageub/InternetIncome/wiki/Network-Settings-vs-Proxy-Container-Type
USE_PROXIES=false

# How each proxy is tunneled to the app containers (only used when USE_PROXIES=true):
#   auto      - script picks the best engine automatically (recommended)
#   tun2socks - force xjasonlyu/tun2socks  (full IP tunnel: TCP + UDP)
#   tun2proxy - force tun2proxy            (full IP tunnel, supports USE_DNS_OVER_HTTPS)
#   redsocks  - lightweight TCP-only redirector (UDP/DNS go direct, not through the proxy)
TUNNEL_METHOD=auto

# Set to true only if your socks5 proxy supports DNS. 
# Leave the default value as it is if you don't know. 
USE_SOCKS5_DNS=false

# Set to true if you would like to use DNS over HTTPS or TCP
USE_DNS_OVER_HTTPS=false

######################### Performance Configuration #########################

#Enable logs only to debug issues, else performance will be degraded
ENABLE_LOGS=false

######################### Access Configuration #########################

# Set to true to disable Mysterium dashboard port publishing
CLOSE_ALL_PORTS=false

########################## User Configuration Ends here ##########################
